version: 2

sources:
  - name: raw
    schema: raw
    description: Raw logistics tables loaded by the Python ingestion pipeline.
    tables:
      - name: hubs
      - name: merchants
      - name: couriers
      - name: orders
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: merchant_id
            data_tests: [not_null]
      - name: tracking_events
        columns:
          - name: event_id
            data_tests: [not_null, unique]
          - name: order_id
            data_tests: [not_null]
      - name: payments
      - name: returns
